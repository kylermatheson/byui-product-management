<!-- Course identity is shared across every chapter. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var title = document.querySelector('.sidebar-title');
    if (!title) return;
    if (!document.querySelector('.sidebar-course-numbers')) {
      var info = document.createElement('div');
      info.className = 'sidebar-course-numbers';
      info.textContent = 'BYU-Idaho · Winter 2027 Second Block';
      title.insertAdjacentElement('afterend', info);
    }
    var chip = document.getElementById('site-version-chip');
    if (chip && !title.contains(chip)) {
      title.appendChild(chip);
      var sep = document.querySelector('.footer-version-sep');
      if (sep) sep.remove();
    }
  });
</script>
