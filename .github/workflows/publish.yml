name: Publish Quarto Website

on:
  push:
    branches: [byui-seven-week]

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/byui-seven-week'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The preservation check compares the archive with its original source commit.
          fetch-depth: 0

      # Ensure Python is available and install Jupyter + friends for Quarto's python engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (Jupyter + project reqs if present)
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbformat ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Install Quarto CLI
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Use a fixed version for reproducibility; can omit to get latest
          version: "1.11.9"

      # Render the Quarto project (will execute python chunks via Jupyter)
      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        # If you want to render a subdir, add:
        # with:
        #   path: .

      - name: Validate rendered course
        run: python3 scripts/check-seven-week-course.py

      # Upload the rendered book, never the repository root or its README.
      # Repository Settings > Pages > Source must be GitHub Actions.
      # Configure and deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_book'  # matches your _quarto.yml output-dir

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
